name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, sqlserver]
    env:
      # The WPF shell targets Windows; this lets Linux restore and compile it (its tests don't run here).
      EnableWindowsTargeting: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Abastalia.slnx -c Release
      - name: Pruebas
        run: dotnet test --solution Abastalia.slnx -c Release --no-build
        env:
          # sqlserver: a Testcontainers SQL Server, image pinned in tests/SqlServerImage.cs
          ABASTALIA_TEST_DB: ${{ matrix.db }}
          # Run as a store PC would (UTC-4) so time-zone bugs show up in CI.
          TZ: America/Santo_Domingo

  web:
    # TK-228: the public site and the owner's panel are one React app (src/Cloud/panel).
    name: Sitio y panel (pruebas y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Cloud/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Cloud/panel/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  lighthouse:
    # TK-261: the public pages, as a phone sees them: SEO 100 and accessibility ≥ 0.95 fail the build; performance and LCP warn (lighthouserc.json).
    name: Sitio (Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Cloud/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Cloud/panel/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: src/Cloud/panel/.lighthouseci
          if-no-files-found: ignore

  ui:
    name: Pruebas de interfaz (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Cloud/panel/package-lock.json
      - run: npm ci
        working-directory: src/Cloud/panel
      - run: dotnet build tests/Abastalia.UiTests/Abastalia.UiTests.csproj -c Release
      - name: Navegador
        run: pwsh tests/Abastalia.UiTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Pruebas
        run: dotnet test --project tests/Abastalia.UiTests/Abastalia.UiTests.csproj -c Release --no-build
        env:
          TZ: America/Santo_Domingo
