name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, sqlserver]
    env:
      # The WPF shell targets Windows; this lets Linux restore and compile it (its tests don't run here).
      EnableWindowsTargeting: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Abastalia.slnx -c Release
      # TK-317/TK-322: the Lite browser signer (Node is on the runner); LiteBrowserSigningTests compares it with the store's signer.
      - run: npm ci --prefix src/Client/lite-signer && npm test --prefix src/Client/lite-signer
      # TK-320: the Azure template compiles (deployLite on and off share it); the Azure CLI is on the runner.
      - if: matrix.db == 'sqlite'
        run: az bicep build --file deploy/azure/main.bicep --stdout > /dev/null
      - name: Pruebas
        run: dotnet test --solution Abastalia.slnx -c Release --no-build
        env:
          # sqlserver: a Testcontainers SQL Server, image pinned in tests/SqlServerImage.cs
          ABASTALIA_TEST_DB: ${{ matrix.db }}
          # Run as a store PC would (UTC-4) so time-zone bugs show up in CI.
          TZ: America/Santo_Domingo

  windows:
    # TK-271: the tests marked [Trait("Category", "Windows")] (powershell.exe, CNG keys, UNC paths) skip on ubuntu; they run here, on Sqlite.
    name: Pruebas solo de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tests/Abastalia.UnitTests/Abastalia.UnitTests.csproj -c Release
      - run: dotnet build tests/Abastalia.IntegrationTests/Abastalia.IntegrationTests.csproj -c Release
      - run: dotnet test --project tests/Abastalia.UnitTests/Abastalia.UnitTests.csproj -c Release --no-build --filter-trait "Category=Windows"
      # TK-305: InstallerSqlTests compiles the installer's SQL on a real SQL Server: the image's LocalDB when it has one (nothing is downloaded);
      # without it that test skips and says why.
      - name: LocalDB
        shell: pwsh
        run: |
          $exe = (Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue).Source ??
            (Get-ChildItem 'C:\Program Files\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe' -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          if ($exe) {
            & $exe start MSSQLLocalDB
            'ABASTALIA_TEST_SQLSERVER=Server=(localdb)\MSSQLLocalDB;Integrated Security=True;TrustServerCertificate=True' >> $env:GITHUB_ENV
          } else { Write-Host '::notice::SQL Server LocalDB is not on this runner: InstallerSqlTests skips.' }
      - run: dotnet test --project tests/Abastalia.IntegrationTests/Abastalia.IntegrationTests.csproj -c Release --no-build --filter-trait "Category=Windows"

  web:
    # TK-228: the public site and the owner's panel are one React app (src/Cloud/panel).
    name: Sitio y panel (pruebas y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Cloud/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Cloud/panel/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  lighthouse:
    # TK-261: the public pages, as a phone sees them: SEO 100 and accessibility ≥ 0.95 fail the build; performance and LCP warn (lighthouserc.json).
    name: Sitio (Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Cloud/panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Cloud/panel/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: src/Cloud/panel/.lighthouseci
          if-no-files-found: ignore

  ui:
    # TK-123/TK-270: tests/Abastalia.UiTests (not in Abastalia.slnx: needs Chromium and Node). Windows because the Escuadra
    # visual baselines are windows ones (font rendering differs per OS); Sqlite, so no SQL Server is needed.
    name: Pruebas de interfaz (Playwright)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Cloud/panel/package-lock.json
      - run: npm ci
        working-directory: src/Cloud/panel
      - run: dotnet build tests/Abastalia.UiTests/Abastalia.UiTests.csproj -c Release
      # The Chromium build that matches the pinned Microsoft.Playwright package (Directory.Packages.props).
      - name: Navegador
        run: pwsh tests/Abastalia.UiTests/bin/Release/net10.0/playwright.ps1 install chromium
      # Run as a store PC would (UTC-4); Windows ignores TZ.
      - run: tzutil /s "SA Western Standard Time"
      - name: Pruebas
        run: dotnet test --project tests/Abastalia.UiTests/Abastalia.UiTests.csproj -c Release --no-build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/Abastalia.UiTests/bin/Release/net10.0/traces
          if-no-files-found: ignore
